<!doctype html><html lang="zh"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stone 的游戏实验室</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#1b1d2b;color:#fff}
main{max-width:960px;margin:0 auto;padding:20px 14px 40px}h1{font-size:26px;margin:6px 0}p.sub{color:#9aa0c3;margin:0 0 14px;font-size:14px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;position:sticky;top:0;background:#1b1d2b;z-index:2;scrollbar-width:none}
#tabs button{flex:none;border:0;border-radius:999px;padding:8px 16px;font-size:14px;background:#2c3050;color:#c9cdf0;cursor:pointer}
#tabs button.on{background:#ffc857;color:#1b1d2b;font-weight:700}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
a.card{display:flex;gap:12px;align-items:center;background:#2c3050;border-radius:16px;padding:14px;color:#fff;text-decoration:none;min-height:84px}
a.card:active{transform:scale(.98)}.e{font-size:36px;width:48px;text-align:center;flex:none}.t{min-width:0}
.n{font-weight:700;font-size:17px}.tag{font-size:11px;color:#1b1d2b;background:#9aa0c3;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px;font-weight:600}
.d{color:#9aa0c3;font-size:13px;margin-top:4px;line-height:1.4}.go{margin-left:auto;color:#ffc857;font-weight:700;flex:none;font-size:14px}
</style></head><body><main><h1>🎮 Stone 的游戏实验室</h1><p class="sub">AI 辅助开发的小游戏试验场 · 点开即玩 · <span id="cnt"></span></p>
<div id="tabs"></div><div id="list">加载中…</div></main>
<script>
fetch('games.json').then(r=>r.json()).then(gs=>{
  document.getElementById('cnt').textContent=`共 ${gs.length} 款`;
  const cats=['全部',...new Set(gs.map(g=>g.cat||'其他'))];let cur='全部';
  const tabs=document.getElementById('tabs'),list=document.getElementById('list');
  const render=()=>{tabs.innerHTML=cats.map(c=>`<button class="${c===cur?'on':''}" data-c="${c}">${c}</button>`).join('');
    list.innerHTML=gs.filter(g=>cur==='全部'||(g.cat||'其他')===cur).map(g=>
    `<a class="card" href="${g.slug}/"><span class="e">${g.emoji||'🎲'}</span><span class="t"><div class="n">${g.name}<span class="tag">${g.cat||'其他'}</span></div><div class="d">${g.desc}</div></span><span class="go">开玩 →</span></a>`).join('');};
  tabs.onclick=e=>{const c=e.target.dataset&&e.target.dataset.c;if(c){cur=c;render();}};render();
}).catch(()=>{document.getElementById('list').textContent='游戏列表加载失败'});
</script></body></html>
